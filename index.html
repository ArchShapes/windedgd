<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WindedGD chat overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { font-synthesis: none; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body.no-message-in .msg, body.no-message-in .msg.cheer, body.no-message-in .msg.cookie, body.no-message-in .msg.hype, body.no-message-in .msg.alertc, body.no-message-in .msg.tts, body.no-message-in .msg.welcome, body.no-message-in .msg.cat { animation: none !important; }
  #chat {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 12px 16px; box-sizing: border-box;
    font-family: "DM Mono", ui-monospace, Menlo, Consolas, monospace; font-weight: 400; letter-spacing: .01em; -webkit-font-smoothing: antialiased;
    font-size: var(--size, 20px); line-height: 1.3; color: #fff;
    text-shadow: 0 2px 6px rgba(0,0,0,.9), 0 0 4px rgba(0,0,0,.95), 0 0 12px rgba(0,0,0,.8), 0 0 24px rgba(0,0,0,.6);
  }
  .msg {
    padding: 3px 0; word-wrap: break-word; overflow-wrap: anywhere;
    animation: in .25s ease-out both; transition: opacity .6s ease;
  }
  .msg.out { opacity: 0; }
  .name { font-weight: 500; }
  .name::after { content: ":"; color: #fff; font-weight: 400; margin-right: .35em; }
  .badges { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 3px; margin-right: 5px; vertical-align: baseline; }
  .chat-badge {
    display: inline-block; padding: 1px 5px; border-radius: 3px;
    font: 700 .62em/1.45 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .025em; text-shadow: none; vertical-align: middle; transform: translateY(-.24em);
    color: #fff; background: #53535f;
  }
  .chat-badge.broadcaster { background: #9147ff; }
  .chat-badge.mod { background: #168a48; }
  .chat-badge.vip { background: #e85d9e; }
  .chat-badge.sub { background: #3869c8; }
  .native-badge { display: inline-block; width: 1.05em; height: 1.05em; vertical-align: -.16em; object-fit: contain; }
  .emote { height: 1.5em; vertical-align: middle; margin: -.2em 1px; }

  /* Command & Sound Label Styling */
  .msg.cmd-label {
    margin: 4px 0; padding: 6px 13px; width: fit-content; max-width: 100%; box-sizing: border-box; text-align: left;
    background: rgba(14,12,20,.82); border: 1px solid rgba(255,255,255,.10); border-left: 3px solid #3ec9b0; border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.3); text-shadow: 0 2px 6px rgba(0,0,0,.9);
    animation: msgIn .35s ease-out backwards;
  }
  .cmd-label .cmd-user { font-weight: 700; color: #3ec9b0; }

  /* TTS Label Card Styling */
  .msg.tts-label {
    margin: 4px 0; padding: 8px 14px; width: fit-content; max-width: 100%; box-sizing: border-box; text-align: left;
    background: rgba(14,12,20,.88); border: 1px solid rgba(255,196,107,.4); border-left: 3px solid #ffc46b; border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.3); text-shadow: 0 2px 6px rgba(0,0,0,.9);
    animation: msgIn .35s ease-out backwards;
  }
  .tts-label .tts-header { font-size: .8em; font-weight: 700; color: #ffc46b; text-transform: uppercase; letter-spacing: 0.05em; }
  .tts-label .tts-text { font-size: 1em; font-weight: 500; color: #fff; margin-top: 2px; }

  #status {
    position: absolute; top: 8px; right: 12px; font: 12px system-ui, sans-serif;
    color: #9aa; opacity: 0; transition: opacity .4s; text-shadow: none;
  }
  #status.show { opacity: .8; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .msg.out { opacity: 0 !important; transform: translateY(-6px); max-height: 0 !important; padding-top: 0 !important; padding-bottom: 0 !important; margin-top: 0 !important; margin-bottom: 0 !important; }
</style>
</head>
<body>

<div id="chat"></div>
<div id="status"></div>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  const SETTINGS_KEY = "global-overlay-settings-v1";
  let settings = { channel: "windedgd", tts: true, alerts: true, chat: true };
  try { settings = { ...settings, ...JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}") }; } catch (e) {}

  const normChannel = (v) => String(v || "").trim().toLowerCase().replace(/^https?:\/\/(www\.)?twitch\.tv\//, "").replace(/^[@#]/, "").replace(/[^a-z0-9_]/g, "").slice(0, 25);
  const CHANNEL = normChannel(params.get("channel")) || normChannel(settings.channel) || "windedgd";
  const FADE_S = parseFloat(params.get("fade") ?? "30");
  const MAX_MSG = Math.max(1, parseInt(params.get("max") || "6", 10));

  const chat = document.getElementById("chat");
  const statusEl = document.getElementById("status");
  const setStatus = (t) => { statusEl.textContent = t; statusEl.classList.toggle("show", !!t); };

  function readable(hex, name) {
    if (!/^#[0-9a-f]{6}$/i.test(hex || "")) {
      let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) >>> 0;
      return `hsl(${h % 360} 70% 65%)`;
    }
    return hex;
  }

  function dismiss(el) {
    if (!el || el._gone) return;
    el._gone = true;
    el.style.animation = "none";
    el.classList.add("out");
    setTimeout(() => el.remove(), 1000);
  }

  function push(el, fade = FADE_S) {
    chat.appendChild(el);
    const all = [...chat.children].filter(e => !e._gone);
    while (all.length > MAX_MSG) dismiss(all.shift());
    if (fade > 0) setTimeout(() => dismiss(el), fade * 1000);
    chat.scrollTop = chat.scrollHeight;
  }

  /* --- TTS Label Banner --- */
  const ttsQueue = [];
  let ttsBusy = false;

  function speakText(text) {
    return new Promise(resolve => {
      if (!("speechSynthesis" in window)) return resolve();
      const u = new SpeechSynthesisUtterance(text);
      u.onend = u.onerror = () => resolve();
      window.speechSynthesis.speak(u);
    });
  }

  async function processTtsQueue() {
    if (ttsBusy || !ttsQueue.length) return;
    ttsBusy = true;
    const text = ttsQueue.shift();
    await speakText(text);
    ttsBusy = false;
    processTtsQueue();
  }

  function showTtsLabel(user, text) {
    const el = document.createElement("div");
    el.className = "msg tts-label";

    const head = document.createElement("div");
    head.className = "tts-header";
    head.textContent = `${user} sent TTS:`;

    const body = document.createElement("div");
    body.className = "tts-text";
    body.textContent = text;

    el.append(head, body);
    push(el, 15);

    ttsQueue.push(text);
    processTtsQueue();
  }

  /* --- Command Notification Label --- */
  const SFX_NAMES = new Set(["vineboom", "bruh", "cookie", "applause", "airhorn", "meow", "knocking", "drip", "bell", "rizz"]);

  function showCmdLabel(user, cmd) {
    const el = document.createElement("div");
    el.className = "msg cmd-label";

    const uSpan = document.createElement("span");
    uSpan.className = "cmd-user";
    uSpan.textContent = user;

    el.append(uSpan, document.createTextNode(` just played ${cmd}!`));
    push(el, 8);
  }

  function handleCommand(tags, user, message) {
    const match = message.match(/^!([a-z0-9]+)(?:\s+(.*))?$/i);
    if (!match) return false;

    const cmd = match[1].toLowerCase();
    const displayName = tags["display-name"] || user;

    if (cmd === "tts") {
      const text = (match[2] || "").trim();
      if (text) showTtsLabel(displayName, text);
      return true;
    }

    // Sound effect or general command execution
    showCmdLabel(displayName, cmd);
    return true;
  }

  /* --- Normal Chat Renderer --- */
  function buildChatLine(tags, user, message) {
    const displayName = tags["display-name"] || user;
    const el = document.createElement("div");
    el.className = "msg";

    const n = document.createElement("span");
    n.className = "name";
    n.textContent = displayName;
    n.style.color = readable(tags.color, displayName);

    const t = document.createElement("span");
    t.className = "text";
    t.textContent = message;

    el.append(n, t);
    return el;
  }

  function parseTags(raw) {
    const out = {};
    raw.split(";").forEach(p => { const i = p.indexOf("="); out[p.slice(0, i)] = p.slice(i + 1); });
    return out;
  }

  /* --- Twitch Connection --- */
  function connectTwitch() {
    setStatus("Connecting to #" + CHANNEL + "…");
    const ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");

    ws.onopen = () => {
      ws.send("CAP REQ :twitch.tv/tags twitch.tv/commands");
      ws.send("PASS SCHMOOPIIE");
      ws.send("NICK justinfan" + Math.floor(10000 + Math.random() * 89999));
      ws.send("JOIN #" + CHANNEL);
    };

    ws.onmessage = (ev) => {
      ev.data.split("\r\n").filter(Boolean).forEach(line => {
        let tags = {}, rest = line;
        if (rest[0] === "@") { const i = rest.indexOf(" "); tags = parseTags(rest.slice(1, i)); rest = rest.slice(i + 1); }
        if (rest.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); return; }

        if (/ JOIN #/.test(rest)) { setStatus(""); return; }

        const parts = rest.match(/^:([^!]+)![^ ]+ PRIVMSG #([^ ]+) :(.*)$/);
        if (parts) {
          const who = parts[1], text = parts[3];

          // If it's a command, handle it as a label and suppress from normal chat
          if (text.startsWith("!")) {
            handleCommand(tags, who, text);
          } else {
            push(buildChatLine(tags, who, text));
          }
        }
      });
    };

    ws.onclose = () => {
      setStatus("Reconnecting…");
      setTimeout(connectTwitch, 3000);
    };
  }

  connectTwitch();
})();
</script>
</body>
</html>
